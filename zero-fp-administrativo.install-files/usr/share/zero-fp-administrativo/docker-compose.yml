services:
  web:
    image: odoo:18
    user: "0:0"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8069:8069"
      - "8072:8072"   # websocket / longpolling
    environment:
      - HOST=db
      - PORT=5432
      - USER=odoo
      - PASSWORD=odoo
      - USER_ID=${USER_ID}
      - GROUP_ID=${GROUP_ID}
    entrypoint: /custom-entrypoint.sh
    volumes:
      - ./custom-entrypoint.sh:/custom-entrypoint.sh:ro
      - odoo-web-data:/var/lib/odoo
      - odoo-conf:/etc/odoo
      - odoo-addons:/mnt/extra-addons
    restart: unless-stopped

  db:
    image: postgres:16
    user: "0:0"
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_USER=odoo
      - POSTGRES_PASSWORD=odoo
      - USER_ID=${USER_ID}
      - GROUP_ID=${GROUP_ID}
      - PGDATA=/var/lib/postgresql/data/pgdata
    entrypoint: /custom-entrypoint.sh
    volumes:
      - ./custom-entrypoint.sh:/custom-entrypoint.sh:ro
      - odoo-db-data:/var/lib/postgresql/data
      - /var/run/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo -d postgres -h localhost"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

volumes:
  odoo-web-data:
    driver: local
    driver_opts:
      type: 'none'
      o: bind
      device: ${ODOO_WEB_DATA_DIR}
  odoo-db-data:
    driver: local
    driver_opts:
      type: 'none'
      o: bind
      device: ${ODOO_DB_DATA_DIR}
  odoo-conf:
    driver: local
    driver_opts:
      type: 'none'
      o: bind
      device: ${ODOO_CONF_DIR}
  odoo-addons:
    driver: local
    driver_opts:
      type: 'none'
      o: bind
      device: ${ODOO_ADDONS_DIR}
